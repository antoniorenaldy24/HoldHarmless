# §0 and §0.1: every error class has an automated checker, and "no release
# proceeds with any of them red". This is what makes the checkers bite: without
# it, scripts/check-invariants.ts and scripts/check-doc-claims.ts only run when
# someone remembers to run them.

name: ci

on:
  push:
  pull_request:

# A newer push to the same branch makes the older run pointless. Cancelling it
# saves Actions minutes rather than spending them on a result nobody will read.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Windows is not optional. The development and demo hosts are Windows,
        # and the timer-resolution fix that makes the network profile real
        # (SSOT §4.5) only takes effect there. A Linux-only CI would never
        # exercise it.
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      - name: typecheck
        run: pnpm typecheck

      # The dashboard has its own tsconfig and was checked by nothing until
      # module 3.6 put a panel in it. Its settings are stricter than the root's
      # (noUnusedLocals), and the first run found a dead import in callmodel.
      - name: typecheck-dashboard
        run: pnpm typecheck:dashboard

      # The bundle is what proves the dashboard's import graph is browser-safe.
      # The core holds a Node HTTP server and the events package writes files;
      # `@holdharmless/core/view` exists so neither reaches the browser, and a
      # typecheck alone would not notice if one started to.
      - name: build-dashboard
        run: pnpm build:dashboard

      # test:ci adds a reporter that turns each failing test into a public
      # annotation. Job logs need a token to read; annotations do not.
      - name: test
        run: pnpm test:ci

      # §17 — INV-11, INV-16, INV-17, INV-21 and the §18 matrix.
      - name: check-invariants
        run: pnpm check:invariants

      # §17.3 — the twelve document checks.
      - name: check-doc-claims
        run: pnpm check:doc
